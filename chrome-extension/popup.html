<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake News Radar</title>
  <style>
    :root {
      --radar-green: #00ff88;
      --radar-blue: #00d4ff;
      --radar-red: #ff3366;
      --radar-yellow: #ffcc00;
      --bg-dark: #0a0e1a;
      --bg-card: #111827;
      --bg-input: #060913;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      width: 350px;
      background: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      padding: 16px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-text {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .logo-green { color: var(--radar-green); text-shadow: 0 0 10px rgba(0,255,136,0.3); }
    .logo-blue { color: var(--radar-blue); text-shadow: 0 0 10px rgba(0,212,255,0.3); }

    /* Inputs */
    .input-section {
      display: flex;
      flex-col: column;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      height: 85px;
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 12px;
      padding: 10px;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--radar-blue);
    }

    .btn-container {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-analyze {
      background: linear-gradient(135deg, var(--radar-blue), var(--radar-green));
      color: #060913;
    }

    .btn-analyze:hover {
      filter: brightness(1.1);
    }

    .btn-analyze:active {
      transform: scale(0.98);
    }

    .btn-clear {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 80px;
    }

    .btn-clear:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    /* Results */
    #resultSection {
      animation: fadeIn 0.4s ease-out;
    }

    .verdict-box {
      display: grid;
      grid-template-columns: 100px 1fr;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .circle-holder {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto;
    }

    .circle-holder svg {
      transform: rotate(-90deg);
    }

    .score-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 900;
      font-size: 14px;
      text-align: center;
    }

    .verdict-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .verdict-label {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .tag-credible { color: var(--radar-green); }
    .tag-suspicious { color: var(--radar-blue); }
    .tag-fake { color: var(--radar-red); }

    .verdict-details {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Metric Bars */
    .metrics-section {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .metric-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .metric-value {
      font-weight: 700;
      color: var(--text-main);
    }

    .bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      transition: width 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .fill-blue { background: linear-gradient(90deg, var(--radar-blue), var(--radar-green)); }
    .fill-green { background: linear-gradient(90deg, #475569, var(--radar-green)); }
    .fill-red { background: linear-gradient(90deg, var(--radar-green), var(--radar-yellow), var(--radar-red)); }

    /* Loading Overlay */
    #loadingOverlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
      gap: 12px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(0, 212, 255, 0.1);
      border-top-color: var(--radar-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .hidden { display: none !important; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-container">
      <!-- Target/Radar Inline SVG -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="m16.2 7.8-8.4 8.4"></path>
        <circle cx="12" cy="12" r="6"></circle>
        <circle cx="12" cy="12" r="2"></circle>
      </svg>
      <span class="logo-text">
        <span class="logo-green">FAKE</span> <span class="logo-blue">RADAR</span>
      </span>
    </div>
  </header>

  <!-- Input Section -->
  <div class="input-section">
    <textarea id="scanText" placeholder="Highlight text on any website, right-click and select 'Verify with Fake News Radar', or paste your content here to begin analysis..."></textarea>
    <div class="btn-container">
      <button class="btn-clear" id="btnClearBtn">Clear</button>
      <button class="btn-analyze" id="btnAnalyzeBtn">
        <!-- Scan Inline SVG -->
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
          <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
          <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
          <path d="M4 12h16"></path>
        </svg>
        Scan Content
      </button>
    </div>
  </div>

  <!-- Loading State -->
  <div id="loadingOverlay" class="hidden">
    <div class="spinner"></div>
    <div class="loading-text">Analyzing semantics...</div>
  </div>

  <!-- Results Section -->
  <div id="resultSection" class="hidden">
    <div class="verdict-box">
      <div class="circle-holder">
        <svg width="80" height="80">
          <circle cx="40" cy="40" r="32" fill="transparent" stroke="rgba(255,255,255,0.04)" stroke-width="5"></circle>
          <circle id="scoreArc" cx="40" cy="40" r="32" fill="transparent" stroke="#00ff88" stroke-width="5" stroke-dasharray="201" stroke-dashoffset="201" stroke-linecap="round" style="transition: stroke-dashoffset 1s ease-out;"></circle>
        </svg>
        <div class="score-text" id="scoreNumber">0%</div>
      </div>
      <div>
        <div class="verdict-title">Model Verdict</div>
        <div class="verdict-label" id="verdictLabel">Credible</div>
        <div class="verdict-details" id="verdictExplanation">This content aligns with objective writing practices.</div>
      </div>
    </div>

    <!-- Linguistic Metrics -->
    <div class="metrics-section">
      <div class="metric-row">
        <div class="metric-header">
          <span>Writing Tone</span>
          <span class="metric-value" id="metricTone">0% Subjective</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill fill-blue" id="barTone"></div>
        </div>
      </div>

      <div class="metric-row">
        <div class="metric-header">
          <span>Citation Density</span>
          <span class="metric-value" id="metricCitations">0%</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill fill-green" id="barCitations"></div>
        </div>
      </div>

      <div class="metric-row">
        <div class="metric-header">
          <span>Clickbait Probability</span>
          <span class="metric-value" id="metricClickbait">0%</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill fill-red" id="barClickbait"></div>
        </div>
      </div>
    </div>

    <!-- Fact Checks Section -->
    <div id="factCheckSection" class="hidden" style="margin-top: 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 51, 102, 0.15); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 6px; color: var(--radar-red); font-size: 11px; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 6px;">
        <!-- Alert Icon -->
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>Factual Disproof Matches</span>
      </div>
      <div id="factCheckList" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
